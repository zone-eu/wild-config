name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            matrix:
                node: [20.x, 22.x, 24.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            # Node 22+ loads ES modules through require() by default, which would hide an ESM-only
            # dependency. Run the suite again with that turned off, as the pkg binary EmailEngine
            # ships would load it.
            - run: npm run test:cjs
              if: matrix.node != '20.x'
